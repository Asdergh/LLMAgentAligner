<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perlin Glass UI Demo</title>
<style>
  :root{
    --bg: #232323;
    --glass-bg: rgba(35,35,35,0.35);
    --panel-bg: rgba(255,255,255,0.05);
    --panel-border: rgba(255,255,255,0.10);
    --text: #eaeaea;
    --text-dim: #a8a8a8;
    --turquoise: #00FF7F;
    --orange: #FFA500;
    --white: #FFFFFF;
    --crimson: #DC143C;
    --gray-accent: #8c8c8c;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0; padding:0;
    width:100%; height:100%;
    background: var(--bg);
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    color: var(--text);
    overflow: hidden;
  }

  /* ---------- слой 1: шум Перлина (воксели) ---------- */
  #noiseCanvas{
    position: fixed;
    top:0; left:0;
    width: 100vw; height: 100vh;
    z-index: 0;
    display:block;
  }

  /* ---------- слой 2: матовое стекло ---------- */
  .glass-layer{
    position: fixed;
    top:0; left:0; right:0; bottom:0;
    z-index: 1;
    background: var(--glass-bg);
    backdrop-filter: blur(18px) saturate(115%);
    -webkit-backdrop-filter: blur(18px) saturate(115%);
    pointer-events: none;
  }
  /* сетка, нанесённая прямо на матовое стекло (поверх размытого шума) */
  .glass-layer::before{
    content: "";
    position: absolute;
    top:0; left:0; right:0; bottom:0;
    background-image:
      repeating-linear-gradient(90deg, rgba(255,255,255,0.09) 0 1px, transparent 1px 34px),
      repeating-linear-gradient(0deg,  rgba(255,255,255,0.09) 0 1px, transparent 1px 34px);
    background-position: -1px -1px;
  }

  /* ---------- слой 3: интерфейс ---------- */
  .app{
    position: relative;
    z-index: 2;
    width: 100%; height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 22px 22px 0 22px;
  }

  header{
    flex: 0 0 auto;
    margin-bottom: 14px;
  }
  header h1{
    margin: 0 0 2px 0;
    font-size: 19px;
    font-weight: 600;
    letter-spacing: 0.2px;
  }
  header p{
    margin: 0;
    font-size: 12.5px;
    color: var(--text-dim);
  }

  /* ---------- панель окон (скроллится, если окон много) ---------- */
  .windows-panel{
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    padding-right: 6px;
    padding-bottom: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .windows-panel::-webkit-scrollbar{ width: 8px; }
  .windows-panel::-webkit-scrollbar-track{ background: transparent; }
  .windows-panel::-webkit-scrollbar-thumb{
    background: rgba(255,255,255,0.18);
    border-radius: 6px;
  }
  .windows-panel::-webkit-scrollbar-thumb:hover{ background: rgba(255,255,255,0.3); }

  /* ---------- окно ---------- */
  .window{
    background: rgba(0,0,0,0.38);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 14px;
    overflow: hidden;
    backdrop-filter: blur(2px);
    transition: background 0.25s ease, border-color 0.25s ease;
    flex: 0 0 auto;
  }
  .window.expanded{
    background: rgba(0,0,0,0.48);
    border-color: rgba(255,255,255,0.12);
  }

  .window-head{
    display:flex;
    align-items:center;
    justify-content: space-between;
    padding: 11px 14px;
    cursor: pointer;
    user-select:none;
  }
  .window-head .titleblock{
    display:flex;
    align-items:center;
    gap: 10px;
    min-width:0;
  }
  .brain-icon{
    width: 18px; height: 15px;
    flex: 0 0 auto;
    display:block;
  }
  .window-head .title{
    font-size: 13.5px;
    font-weight: 600;
    white-space: nowrap;
    overflow:hidden;
    text-overflow: ellipsis;
  }
  .window-head .sub{
    font-size: 11px;
    color: var(--text-dim);
    margin-left: 6px;
    flex: 0 0 auto;
  }
  .window-head .head-right{
    display:flex;
    align-items:center;
    gap: 10px;
    flex: 0 0 auto;
  }
  .chevron{
    width: 18px; height:18px;
    flex: 0 0 auto;
    transition: transform 0.3s ease;
    opacity: 0.7;
  }
  .window.expanded .chevron{ transform: rotate(180deg); }

  .window-body{
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.38s cubic-bezier(.4,0,.2,1), padding 0.38s ease;
    padding: 0 14px;
  }
  .window.expanded .window-body{
    max-height: 320px;
    padding: 0 14px 14px 14px;
  }

  .window-body .text{
    font-size: 13px;
    line-height: 1.55;
    color: #d9d9d9;
    margin: 4px 0 12px 0;
  }

  /* ---------- шкала оценки 1-5 ---------- */
  .rating{
    display:flex;
    align-items:center;
    gap: 8px;
  }
  .rating .label{
    font-size: 11px;
    color: var(--text-dim);
    flex: 0 0 auto;
  }
  .rating-track{
    flex: 1 1 auto;
    display:flex;
    gap: 4px;
  }
  .rating-seg{
    flex: 1 1 0;
    height: 6px;
    border-radius: 4px;
    background: rgba(255,255,255,0.08);
    overflow: hidden;
    position: relative;
  }
  .rating-seg .fill{
    position:absolute;
    inset:0;
    width: 0%;
    border-radius: 4px;
    transition: width 0.5s ease;
    transition-delay: 0.15s;
  }
  .rating .score{
    font-size: 11.5px;
    font-weight: 600;
    color: var(--text);
    width: 26px;
    text-align:right;
    flex: 0 0 auto;
  }

  /* ---------- нижнее поле ввода ---------- */
  .input-bar{
    flex: 0 0 auto;
    padding: 12px 0 18px 0;
    display: flex;
    justify-content: center;
  }
  .input-wrap{
    width: min(720px, 100%);
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 22px;
    padding: 6px 8px 6px 18px;
    display:flex;
    align-items:flex-end;
    gap: 10px;
    backdrop-filter: blur(4px);
    transition: border-color 0.2s ease;
  }
  .input-wrap:focus-within{
    border-color: rgba(255,255,255,0.32);
  }
  #chatInput{
    flex: 1 1 auto;
    background: transparent;
    border: none;
    outline: none;
    resize: none;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    line-height: 1.5;
    padding: 8px 0;
    max-height: 160px;
    overflow-y: hidden;
  }
  #chatInput::placeholder{ color: var(--text-dim); }
  #chatInput::-webkit-scrollbar{ width: 6px; }
  #chatInput::-webkit-scrollbar-thumb{
    background: rgba(255,255,255,0.2);
    border-radius: 4px;
  }
  .send-btn{
    flex: 0 0 auto;
    width: 36px; height: 36px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, var(--turquoise), var(--crimson));
    color: #1c1c1c;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    margin-bottom: 4px;
    transition: transform 0.15s ease, filter 0.15s ease;
  }
  .send-btn:hover{ filter: brightness(1.08); transform: scale(1.05); }
  .send-btn:active{ transform: scale(0.94); }

  @keyframes bubbleIn{
    from{ opacity:0; transform: translateY(6px); }
    to{ opacity:1; transform: translateY(0); }
  }
  .window.new-entry{ animation: bubbleIn 0.25s ease; }

  /* ---------- кнопка "..." скрывающая старые окна ---------- */
  .more-toggle{
    align-self: center;
    flex: 0 0 auto;
    background: rgba(255,255,255,0.07);
    border: 1px solid var(--panel-border);
    color: var(--text-dim);
    font-size: 12px;
    letter-spacing: 1px;
    padding: 6px 16px;
    border-radius: 20px;
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .more-toggle:hover{
    background: rgba(255,255,255,0.13);
    color: var(--text);
  }
</style>
</head>

<body>

<canvas id="noiseCanvas"></canvas>
<div class="glass-layer"></div>

<div class="app">
  <header>
    <h1>Мессенджер · демо шума Перлина</h1>
    <p>Сообщение справа — от вас, окно слева — ответ платформы. Больше 3 окон — прячутся за «···».</p>
  </header>

  <div class="windows-panel" id="windowsPanel"></div>

  <div class="input-bar">
    <div class="input-wrap">
      <textarea id="chatInput" rows="1" placeholder="Введите текст…"></textarea>
      <button class="send-btn" title="Отправить">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
          <path d="M3 11L21 3L13 21L11 13L3 11Z" fill="currentColor"/>
        </svg>
      </button>
    </div>
  </div>
</div>

<script>
/* ======================================================================
   1) ФОН: обычный непрерывный шум Перлина, залитый плоскими ячейками.
      Слой лежит под матовым стеклом (glass-layer, z-index:1),
      а окна с текстом расположены выше всего этого (app, z-index:2).
   ====================================================================== */
(function(){
  const canvas = document.getElementById('noiseCanvas');
  const ctx = canvas.getContext('2d');

  // --- классический 3D шум Перлина (compact impl) ---
  const perm = new Uint8Array(512);
  (function initPerm(){
    const p = new Uint8Array(256);
    for(let i=0;i<256;i++) p[i]=i;
    let seed = 1337;
    function rnd(){ seed = (seed*9301+49297)%233280; return seed/233280; }
    for(let i=255;i>0;i--){
      const j = Math.floor(rnd()*(i+1));
      const t = p[i]; p[i]=p[j]; p[j]=t;
    }
    for(let i=0;i<512;i++) perm[i]=p[i&255];
  })();
  function fade(t){ return t*t*t*(t*(t*6-15)+10); }
  function lerp(a,b,t){ return a+t*(b-a); }
  function grad(hash,x,y,z){
    const h = hash & 15;
    const u = h<8 ? x : y;
    const v = h<4 ? y : (h===12||h===14 ? x : z);
    return ((h&1)===0 ? u : -u) + ((h&2)===0 ? v : -v);
  }
  function perlin3(x,y,z){
    const X=Math.floor(x)&255, Y=Math.floor(y)&255, Z=Math.floor(z)&255;
    x-=Math.floor(x); y-=Math.floor(y); z-=Math.floor(z);
    const u=fade(x), v=fade(y), w=fade(z);
    const A=perm[X]+Y, AA=perm[A]+Z, AB=perm[A+1]+Z;
    const B=perm[X+1]+Y, BA=perm[B]+Z, BB=perm[B+1]+Z;
    return lerp(
      lerp(
        lerp(grad(perm[AA],x,y,z),     grad(perm[BA],x-1,y,z),   u),
        lerp(grad(perm[AB],x,y-1,z),   grad(perm[BB],x-1,y-1,z), u),
        v),
      lerp(
        lerp(grad(perm[AA+1],x,y,z-1),   grad(perm[BA+1],x-1,y,z-1),   u),
        lerp(grad(perm[AB+1],x,y-1,z-1), grad(perm[BB+1],x-1,y-1,z-1), u),
        v),
      w);
  }

  // --- цветовой градиент: бирюзовый -> серый -> малиновый ---
  const C_TURQ    = [0,255,127];
  const C_GRAY    = [140,140,140];
  const C_CRIMSON = [220,20,60];
  function mixColor(c1,c2,t){
    return [
      Math.round(c1[0]+(c2[0]-c1[0])*t),
      Math.round(c1[1]+(c2[1]-c1[1])*t),
      Math.round(c1[2]+(c2[2]-c1[2])*t)
    ];
  }
  const STOP_A = 0.45; // до порога: бирюзовый -> серый, после: серый -> малиновый
  function colorForValue(n){
    if(n <= STOP_A){
      return mixColor(C_TURQ, C_GRAY, n/STOP_A);
    } else {
      return mixColor(C_GRAY, C_CRIMSON, (n-STOP_A)/(1-STOP_A));
    }
  }

  let W, H, cols, rows;
  const CELL = 22; // размер плоской ячейки
  function resize(){
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
    cols = Math.ceil(W/CELL)+1;
    rows = Math.ceil(H/CELL)+1;
  }
  window.addEventListener('resize', resize);
  resize();

  const FREQ = 0.09;
  const TFREQ = 0.10;
  let t = 0;

  function draw(){
    t += 0.006;
    for(let j=0;j<rows;j++){
      for(let i=0;i<cols;i++){
        const raw = perlin3(i*FREQ, j*FREQ, t*10*TFREQ);
        const n = Math.min(1, Math.max(0, (raw+1)/2));
        const [r,g,b] = colorForValue(n);
        ctx.fillStyle = `rgb(${r},${g},${b})`;
        ctx.fillRect(i*CELL, j*CELL, CELL, CELL);
      }
    }
    requestAnimationFrame(draw);
  }
  draw();
})();

/* ======================================================================
   2) МЕССЕНДЖЕР: и сообщение пользователя, и ответ платформы — окна
      одного стиля (сворачивание, лого-«мозг»), различаются только
      затемнением фона. У ответов платформы есть шкала оценки 1–5
      с общей colormap: красный (низкая оценка) -> бирюзовый (высокая).
   ====================================================================== */
(function(){
  const feed = document.getElementById('windowsPanel');

  // --- логотип "мозг" (профиль), белого цвета, чуть более детализированный ---
  const BRAIN_ROWS = [
    "..1111....",
    ".111111...",
    "11111111..",
    "11.11.111.",
    "1111.11111",
    ".11111111.",
    "..111111..",
    "...1111...",
  ];
  const BRAIN_CELLS = [];
  BRAIN_ROWS.forEach((row, ry) => {
    for(let rx=0; rx<row.length; rx++){
      if(row[rx] === '1') BRAIN_CELLS.push([rx, ry]);
    }
  });
  function brainIconSVG(color){
    const cell = 1.6, gap = 0.3, step = cell+gap;
    const rects = BRAIN_CELLS.map(([cx,cy]) =>
      `<rect x="${cx*step}" y="${cy*step}" width="${cell}" height="${cell}" rx="0.35" fill="${color}"/>`
    ).join('');
    return `<svg class="brain-icon" viewBox="0 0 19 15.5" xmlns="http://www.w3.org/2000/svg">${rects}</svg>`;
  }

  // --- общая colormap для шкалы оценки: красный -> бирюзовый ---
  const C_RED  = [255, 45, 45];
  const C_TURQ = [0, 255, 127];
  function ratingColor(index, max){
    const t = index / (max - 1);
    return `rgb(${Math.round(C_RED[0]+(C_TURQ[0]-C_RED[0])*t)},${Math.round(C_RED[1]+(C_TURQ[1]-C_RED[1])*t)},${Math.round(C_RED[2]+(C_TURQ[2]-C_RED[2])*t)})`;
  }
  function buildRatingHTML(rating){
    const segs = Array.from({length:5}, (_, i) =>
      `<div class="rating-seg"><div class="fill" style="background:${ratingColor(i,5)}"></div></div>`
    ).join('');
    return `
      <div class="rating" data-rating="${rating}">
        <span class="label">Оценка</span>
        <div class="rating-track">${segs}</div>
        <span class="score">${rating}/5</span>
      </div>`;
  }

  const responseTexts = [
    "Понял вас. Вот развёрнутый ответ на основе того, что вы написали — блок можно свернуть заголовком.",
    "Готово. Ниже — краткий разбор с оценкой уверенности платформы по шкале снизу.",
    "Обработал запрос. Дополнительные детали скрыты, пока окно свёрнуто — раскройте его для полного текста.",
    "Вот что удалось найти по вашему сообщению. Оценка результата — в шкале под текстом.",
    "Ответ сформирован. При большом количестве окон старые будут скрываться за кнопкой «···».",
    "Принято к обработке. Результат ниже, шкала оценки окрашена по общей цветовой карте красный→бирюзовый.",
  ];

  let counter = 0;
  const items = []; // { el } — плоский список всех окон (и пользователя, и платформы)
  let historyExpanded = false;
  const VISIBLE_COUNT = 3;

  function updateRatingFill(win){
    const ratingEl = win.querySelector('.rating');
    if(!ratingEl) return;
    const rating = parseInt(ratingEl.dataset.rating, 10);
    const segs = ratingEl.querySelectorAll('.rating-seg .fill');
    segs.forEach((fillEl, idx) => { fillEl.style.width = (idx < rating) ? '100%' : '0%'; });
  }

  function buildWindow({ id, title, text, isUser, rating, expanded }){
    const win = document.createElement('div');
    win.className = 'window new-entry' + (isUser ? ' user-window' : '') + (expanded ? ' expanded' : '');
    win.innerHTML = `
      <div class="window-head">
        <div class="titleblock">
          <span class="title">${title}</span>
          <span class="sub">#${1000+id}</span>
        </div>
        <div class="head-right">
          ${brainIconSVG(isUser ? '#ffffff' : '#FFA500')}
          <svg class="chevron" viewBox="0 0 24 24" fill="none">
            <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>
      <div class="window-body">
        <p class="text">${text}</p>
        ${rating != null ? buildRatingHTML(rating) : ''}
      </div>
    `;
    const head = win.querySelector('.window-head');
    head.addEventListener('click', () => {
      const wasExpanded = win.classList.contains('expanded');
      win.classList.toggle('expanded');
      if(!wasExpanded) updateRatingFill(win);
    });
    if(expanded) updateRatingFill(win);
    return win;
  }

  // перестраивает порядок окон в ленте: старые прячутся за "···"
  function render(){
    feed.querySelectorAll('.more-toggle').forEach(n => n.remove());

    const hiddenCount = Math.max(0, items.length - VISIBLE_COUNT);

    items.forEach((it, idx) => {
      const isOld = idx < hiddenCount;
      const shouldShow = !isOld || historyExpanded;
      it.el.style.display = shouldShow ? '' : 'none';
      feed.appendChild(it.el);
    });

    if(hiddenCount > 0){
      const toggle = document.createElement('button');
      toggle.className = 'more-toggle';
      toggle.textContent = historyExpanded ? '▲ свернуть историю' : `··· показать ещё ${hiddenCount}`;
      toggle.addEventListener('click', () => {
        historyExpanded = !historyExpanded;
        render();
      });
      feed.insertBefore(toggle, feed.firstChild);
    }

    feed.scrollTop = feed.scrollHeight;
  }

  function addExchange(userText){
    counter++;
    const userWin = buildWindow({
      id: counter, title: 'Вы', text: userText,
      isUser: true, rating: null, expanded: true
    });
    items.push({ el: userWin });

    counter++;
    const rating = (counter % 5) + 1;
    const responseText = responseTexts[counter % responseTexts.length];
    const responseWin = buildWindow({
      id: counter, title: 'Ответ платформы', text: responseText,
      isUser: false, rating, expanded: true
    });
    items.push({ el: responseWin });

    render();
  }

  // --- сид: несколько примеров переписки для демонстрации ---
  const seedMessages = [
    "Привет! Покажи, как выглядит окно с ответом.",
    "А что будет, если сообщений станет много?",
    "Отлично, а как работает оценка внизу окна?",
    "Проверим скрытие старых окон за «···».",
  ];
  seedMessages.forEach(addExchange);

  window.__sendChatMessage = addExchange;
})();

/* ======================================================================
   3) НИЖНЕЕ ПОЛЕ ВВОДА: авто-рост + скролл после лимита + отправка
   ====================================================================== */
(function(){
  const el = document.getElementById('chatInput');
  const sendBtn = document.querySelector('.send-btn');
  const MAX_HEIGHT = 160;

  function resize(){
    el.style.height = 'auto';
    const needed = el.scrollHeight;
    if(needed > MAX_HEIGHT){
      el.style.height = MAX_HEIGHT + 'px';
      el.style.overflowY = 'auto';
    } else {
      el.style.height = needed + 'px';
      el.style.overflowY = 'hidden';
    }
  }
  el.addEventListener('input', resize);
  resize();

  function send(){
    const text = el.value.trim();
    if(!text) return;
    if(typeof window.__sendChatMessage === 'function'){
      window.__sendChatMessage(text);
    }
    el.value = '';
    resize();
    el.focus();
  }

  sendBtn.addEventListener('click', send);
  el.addEventListener('keydown', (e) => {
    if(e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      send();
    }
  });
})();
</script>

</body>
</html>
